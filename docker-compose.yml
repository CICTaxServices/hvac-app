version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hvac-postgres
    environment:
      POSTGRES_USER: hvac_user
      POSTGRES_PASSWORD: hvac_password_change_me
      POSTGRES_DB: hvac_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/models/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac_user -d hvac_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvac-network

  # Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hvac-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hvac_user
      DB_PASSWORD: hvac_password_change_me
      DB_NAME: hvac_db
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: your_jwt_secret_change_me_in_production
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your_email@gmail.com
      EMAIL_PASSWORD: your_email_password
      EMAIL_FROM: noreply@hvacservice.com
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads
    networks:
      - hvac-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hvac-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hvac-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  hvac-network:
    driver: bridge
